<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f4f0ff,#e8f9ff 55%,#fff8e1);min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer;font-weight:750;border-radius:14px;padding:12px 17px;transition:transform .15s,filter .15s}button:hover{filter:brightness(.98);transform:translateY(-1px)}button:focus-visible,input:focus-visible{outline:3px solid #ffb703;outline-offset:3px}.primary{background:var(--purple);color:white;box-shadow:0 5px 0 #4234b4}.secondary{background:#fff;border:2px solid var(--line);color:var(--ink)}.success{background:#138a56;color:white}.warning{background:#ffcf56;color:#493300}.danger{background:#ffe2e2;color:#8a2525}.muted{color:#68738a;font-size:.92rem}.app{max-width:1050px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-mark{font-size:1.6rem;background:#fff;border-radius:16px;padding:8px;box-shadow:var(--shadow)}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{padding:9px 12px;font-size:.9rem}.progress-wrap{height:10px;background:#ffffffb8;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress{height:100%;background:linear-gradient(90deg,#5b4bdb,#26b9a5);width:0%;transition:width .3s}.panel{background:#ffffffed;border:1px solid #fff;border-radius:26px;padding:clamp(20px,4vw,38px);box-shadow:var(--shadow);margin-bottom:18px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center}.eyebrow{display:inline-block;padding:7px 12px;border-radius:99px;background:var(--yellow);font-size:.85rem;font-weight:850}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.04;margin:14px 0}h2{font-size:clamp(1.45rem,3vw,2rem);margin:0 0 12px}h3{margin:8px 0}.hero-art{background:linear-gradient(140deg,#dff5ff,#fce1f0);border-radius:25px;min-height:240px;display:grid;place-items:center;font-size:clamp(5rem,15vw,9rem);position:relative}.float-tag{position:absolute;font-size:1rem;font-weight:900;background:white;padding:9px 12px;border-radius:15px;box-shadow:var(--shadow)}.float-tag.a{top:18px;left:12px}.float-tag.b{right:12px;bottom:20px}.meta-grid,.tile-grid,.note-grid,.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.meta{padding:13px;border-radius:16px;background:#f6f4ff}.meta b{display:block;font-size:.82rem;color:#68738a;margin-bottom:4px}.meta span{font-weight:800}.field{display:block;font-weight:800;margin:16px 0 7px}.name-input{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.tile{padding:18px;border-radius:19px;min-height:130px}.tile .emoji{font-size:2rem}.tile.blue{background:var(--blue)}.tile.pink{background:var(--pink)}.tile.yellow{background:var(--yellow)}.tile.green{background:var(--green)}.step-label{font-size:.85rem;color:#6b6892;font-weight:850;letter-spacing:.04em;text-transform:uppercase}.note-card{border-radius:20px;padding:18px;min-height:150px}.note-card .big{font-size:2.5rem}.callout{background:#fff8dc;border-left:5px solid #ffca3a;padding:14px 16px;border-radius:12px;margin:15px 0}.video-box{background:#161b2d;color:white;padding:24px;border-radius:20px;text-align:center}.video-box .big{font-size:3rem}.choice{background:#fff;border:2px solid var(--line);text-align:left;width:100%;min-height:60px}.choice.selected{border-color:var(--purple);background:#f0edff}.choice.correct{border-color:#159b62;background:#e0faea}.choice.wrong{border-color:#d74b4b;background:#fff0f0}.answer-feedback{padding:15px;border-radius:15px;margin-top:14px}.feedback-good{background:#e0faea}.feedback-bad{background:#fff0f0}.quiz-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:850;margin-bottom:14px}.progress-wrap.small{height:8px;margin:8px 0 20px}.badge-card{display:inline-flex;gap:8px;align-items:center;background:#fff1b8;padding:12px 16px;border-radius:16px;font-weight:900;margin:5px}.footer{padding:15px;text-align:center;color:#65718a;font-size:.85rem}.hidden{display:none!important}.smallprint{font-size:.85rem;color:#69748a;line-height:1.5}a{color:#4b3cc7;font-weight:800}.list-clean{padding-left:22px;line-height:1.7}.result-score{font-size:clamp(3rem,10vw,5.5rem);font-weight:1000;color:var(--purple);line-height:1}.stars{font-size:2rem;letter-spacing:5px}.review-row{padding:14px;border:1px solid var(--line);border-radius:15px;margin:10px 0}.review-row summary{cursor:pointer;font-weight:850}.pill{display:inline-block;padding:5px 9px;background:#f0edff;border-radius:99px;font-size:.8rem;font-weight:800}

<script>
const TEACHER="MUHAMAD SYAWALWAHED", SCHOOL="SK (P) JALAN YAHYA AWAL";
const VIDEO1="https://www.youtube.com/watch?v=fbAWSONbRJc";
const VIDEO2="https://www.youtube.com/watch?v=LuAfFwth8bk";
const lessons=[
{icon:"👀",title:"1. Kenali ancaman sekeliling",color:"blue",body:"Ancaman sekeliling ialah keadaan, tempat atau tindakan yang boleh mendatangkan bahaya kepada keselamatan diri.",example:"Contoh: orang tidak dikenali mengajak kita mengikutnya, kawasan sunyi, atau bermain berhampiran jalan raya.",tip:"Jika berasa tidak selamat, jauhkan diri dan pergi ke tempat yang selamat."},
{icon:"🛑",title:"2. Kenal pasti tempat berisiko",color:"pink",body:"Perhatikan keadaan sekeliling. Tempat sunyi, laluan gelap atau kawasan tanpa orang dewasa yang dipercayai boleh meningkatkan risiko.",example:"Berjalan seorang diri di tempat sunyi selepas sekolah boleh berisiko.",tip:"Pilih laluan yang biasa, terang dan ramai orang. Beritahu orang dewasa yang dipercayai ke mana kita pergi."},
{icon:"🙅",title:"3. Berani berkata TIDAK",color:"yellow",body:"Kita boleh berkata “Tidak, saya tidak boleh ikut” dengan suara yang jelas apabila sesuatu ajakan membuat kita tidak selesa atau tidak selamat.",example:"Orang yang tidak dikenali menawarkan gula-gula dan mengajak masuk ke kereta. Tolak dan beredar ke tempat selamat.",tip:"Tidak perlu ikut orang yang tidak dikenali, walaupun mereka memberi hadiah atau mendakwa mengenali keluarga."},
{icon:"🏃",title:"4. Jauhkan diri dan cari bantuan",color:"green",body:"Jika berdepan situasi berbahaya, jangan berdebat atau cuba menyelesaikannya seorang diri. Bergerak ke tempat selamat dan dapatkan bantuan.",example:"Pergi ke pejabat sekolah, pondok pengawal, kedai yang mempunyai pekerja, atau berhampiran guru.",tip:"Beritahu guru, ibu bapa/penjaga atau orang dewasa yang dipercayai dengan segera."},
{icon:"🤝",title:"5. Rahsia yang tidak selamat perlu diceritakan",color:"blue",body:"Jika seseorang mengugut, meminta kita merahsiakan sesuatu yang membuat kita takut, atau menyentuh/melakukan sesuatu yang tidak selesa, ceritakan kepada orang dewasa yang dipercayai.",example:"Katakan: “Saya rasa tidak selamat. Tolong bantu saya.”",tip:"Jika orang pertama tidak membantu, beritahu orang dewasa lain sehingga ada yang membantu. Keselamatan kamu bukan salah kamu."}
];
const questions=[
{q:"Apakah maksud ancaman sekeliling?",o:["Perkara yang sentiasa menyeronokkan","Keadaan atau tindakan yang boleh membahayakan keselamatan diri","Semua aktiviti di rumah"],a:1,e:"Ancaman sekeliling ialah keadaan atau tindakan yang boleh mendatangkan bahaya kepada diri."},
{q:"Kamu berasa takut apabila orang tidak dikenali mengajak masuk ke keretanya. Apakah tindakan terbaik?",o:["Terus masuk","Tolak, beredar ke tempat selamat dan minta bantuan","Ambil hadiah dahulu"],a:1,e:"Jangan ikut orang tidak dikenali. Beredar ke tempat selamat dan maklumkan orang dewasa yang dipercayai."},
{q:"Antara berikut, yang manakah tempat yang mungkin berisiko jika pergi bersendirian?",o:["Pejabat guru yang terbuka","Kawasan sunyi tanpa orang yang boleh membantu","Perpustakaan bersama guru"],a:1,e:"Kawasan sunyi boleh menyukarkan kita mendapatkan bantuan. Pilih tempat yang selamat dan maklumkan penjaga."},
{q:"Apakah ayat yang sesuai apabila ajakan membuat kamu tidak selesa?",o:["“Tidak, saya tidak mahu. Saya akan pergi sekarang.”","“Baiklah, saya ikut.”","“Saya ikut jika diberi hadiah.”"],a:0,e:"Berkata tidak dengan jelas, kemudian beredar ke tempat selamat."},
{q:"Siapakah yang sesuai diminta bantuan apabila kamu berasa terancam di sekolah?",o:["Orang dewasa yang dipercayai seperti guru","Orang asing di luar pagar","Tiada sesiapa"],a:0,e:"Guru atau kakitangan sekolah yang dipercayai boleh membantu kamu mendapatkan keselamatan."},
{q:"Orang tidak dikenali menawarkan gula-gula dan meminta kamu mengikutnya. Kamu patut…",o:["Mengikutnya kerana ada gula-gula","Menolak, menjauh dan memberitahu orang dewasa","Menyembunyikan perkara itu"],a:1,e:"Hadiah bukan alasan untuk mengikut orang yang tidak dikenali. Tolak dan beritahu orang dewasa."},
{q:"Mengapakah kita perlu memberitahu penjaga tentang laluan pulang?",o:["Supaya orang yang dipercayai tahu ke mana kita pergi","Supaya boleh ponteng","Supaya boleh berjalan ke mana-mana tanpa izin"],a:0,e:"Memaklumkan laluan membantu penjaga mengetahui lokasi dan merancang keselamatan."},
{q:"Jika seseorang meminta kamu merahsiakan sesuatu yang membuat kamu takut, apakah tindakan wajar?",o:["Simpan rahsia selama-lamanya","Ceritakan kepada orang dewasa yang dipercayai","Salahkan diri sendiri"],a:1,e:"Rahsia yang membuat kamu takut atau tidak selamat perlu diceritakan kepada orang dewasa yang dipercayai."},
{q:"Apakah pilihan laluan yang lebih selamat ketika pulang dari sekolah?",o:["Laluan sunyi yang tidak diketahui orang","Laluan biasa yang terang dan ramai orang","Jalan pintas melalui kawasan terbiar"],a:1,e:"Pilih laluan yang biasa, terang dan mempunyai orang yang boleh membantu."},
{q:"Kamu tersesat di pusat membeli-belah. Siapakah yang patut kamu cari?",o:["Orang dewasa berseragam atau kaunter khidmat pelanggan","Orang yang menawarkan untuk membawa kamu ke mana-mana","Keluar seorang diri mencari jalan"],a:0,e:"Minta bantuan petugas keselamatan atau kaunter khidmat pelanggan dan hubungi penjaga."},
{q:"Apakah maksud bertindak secara bijak untuk menjaga keselamatan diri?",o:["Mengambil risiko untuk membuktikan keberanian","Mengenal pasti bahaya dan memilih tindakan selamat","Mengikut semua arahan orang lain"],a:1,e:"Tindakan bijak bermaksud mengenal pasti risiko, menjauhkan diri dan mendapatkan bantuan."},
{q:"Jika seseorang yang tidak dikenali berkata dia kawan ibu kamu lalu mahu membawa kamu pulang, kamu patut…",o:["Terus ikut kerana dia tahu nama ibu","Sahkan dengan ibu/penjaga atau guru sebelum bergerak","Masuk ke kenderaan tanpa bertanya"],a:1,e:"Jangan pergi sebelum pengesahan dibuat oleh penjaga atau guru melalui cara yang selamat."},
{q:"Apakah tindakan yang paling selamat jika kamu diekori dan berasa takut?",o:["Pergi ke tempat ramai orang dan minta bantuan","Pergi ke tempat sunyi","Berhenti dan berdebat dengannya"],a:0,e:"Pergi ke tempat awam yang selamat dan minta bantuan orang dewasa atau pihak berkuasa."},
{q:"Mengapakah kita tidak patut berkongsi maklumat peribadi dengan orang tidak dikenali?",o:["Maklumat itu boleh digunakan untuk mencari atau menghubungi kita","Supaya kita tidak boleh belajar","Kerana semua orang berniat jahat"],a:0,e:"Jaga alamat rumah, nombor telefon dan maklumat peribadi. Tidak semua orang dikenali atau boleh dipercayai."},
{q:"Jika kamu berasa tidak selesa dengan sesuatu tindakan orang lain, kamu boleh…",o:["Bersuara, menjauh dan memberitahu orang dewasa dipercayai","Diam walaupun takut","Menyalahkan diri sendiri"],a:0,e:"Perasaan tidak selesa perlu diambil serius. Cari bantuan dan ingat bahawa kamu berhak berasa selamat."},
{q:"Di manakah tempat yang sesuai untuk menunggu penjaga?",o:["Di tempat yang telah dipersetujui dan diawasi","Di lorong sunyi","Di dalam kenderaan orang tidak dikenali"],a:0,e:"Tunggu di lokasi yang dipersetujui bersama penjaga dan minta bantuan petugas yang dipercayai jika perlu."},
{q:"Apakah yang patut dibuat jika orang dewasa yang dipercayai pertama tidak membantu?",o:["Berhenti meminta bantuan","Beritahu orang dewasa lain yang dipercayai sehingga mendapat bantuan","Simpan masalah itu"],a:1,e:"Teruskan memberitahu orang dewasa lain yang boleh membantu. Keselamatan kamu penting."},
{q:"Apakah cara yang baik untuk mengelakkan risiko ketika bermain di luar?",o:["Beritahu penjaga, bermain di tempat sesuai dan ikut peraturan","Pergi jauh tanpa memberitahu sesiapa","Menerima pelawaan orang asing"],a:0,e:"Beritahu penjaga lokasi, pilih tempat sesuai dan patuhi peraturan keselamatan."},
{q:"Apakah tindakan yang wajar apabila melihat rakan dibawa pergi oleh orang tidak dikenali dan rakan itu kelihatan takut?",o:["Ikut mereka berdua","Segera maklumkan guru atau orang dewasa dipercayai; jangan membahayakan diri","Buat tidak tahu"],a:1,e:"Maklumkan orang dewasa dengan segera. Jangan cuba berhadapan sendiri jika itu membahayakan kamu."},
{q:"Mengapakah penting untuk mengenal pasti orang dewasa yang boleh dipercayai?",o:["Supaya tahu siapa yang boleh diminta bantuan","Supaya boleh ikut semua orang dewasa","Supaya tidak perlu memberitahu penjaga"],a:0,e:"Kenal pasti beberapa orang dewasa dipercayai seperti ibu bapa, penjaga, guru atau saudara yang selamat."},
{q:"Jika seseorang meminta kamu pergi ke tempat lain tanpa pengetahuan penjaga, kamu patut…",o:["Pergi kerana dia mendesak","Berhenti, jangan ikut dan sahkan dengan penjaga/guru","Ikut jika tempat itu dekat"],a:1,e:"Jangan ikut ajakan yang tidak disahkan. Dapatkan izin dan pengesahan daripada penjaga atau guru."},
{q:"Apakah tindakan yang menunjukkan kamu peka terhadap persekitaran?",o:["Menyedari tempat sunyi dan mencari laluan lebih selamat","Memakai fon kepala kuat sehingga tidak sedar sekeliling","Mengabaikan rasa tidak selesa"],a:0,e:"Peka terhadap persekitaran membantu kamu mengenal pasti risiko dan bertindak lebih awal."},
{q:"Apakah yang perlu kamu lakukan selepas berjaya pergi ke tempat selamat?",o:["Beritahu orang dewasa dipercayai tentang apa yang berlaku","Pulang tanpa memberitahu sesiapa","Kembali untuk berdebat"],a:0,e:"Beritahu orang dewasa supaya mereka boleh membantu dan mengambil langkah keselamatan."},
{q:"Adakah kamu perlu menerima ajakan hanya kerana orang itu memberi hadiah?",o:["Ya, hadiah bermaksud dia boleh dipercayai","Tidak. Tolak jika tidak selamat dan beritahu orang dewasa","Ya, jika hadiah itu mahal"],a:1,e:"Hadiah tidak menjadikan ajakan itu selamat. Percayai peraturan keselamatan dan minta bantuan."},
{q:"Pilih urutan tindakan yang paling sesuai apabila menghadapi ancaman.",o:["Ikut ajakan → rahsiakan → tunggu","Kenal pasti bahaya → jauhkan diri → cari bantuan","Berdebat → pergi ke tempat sunyi → diam"],a:1,e:"Kenal pasti risiko, bergerak ke tempat selamat dan maklumkan orang dewasa yang dipercayai."}
];
let state={name:"",screen:"home",lesson:0,qIndex:0,answers:[],gameScore:0,gameIndex:0,gameDone:false,sound:true,completed:false};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("kembaraKesihatanT3",JSON.stringify({name:state.name,lesson:state.lesson,qIndex:state.qIndex,answers:state.answers,gameScore:state.gameScore,gameIndex:state.gameIndex,gameDone:state.gameDone,completed:state.completed}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem("kembaraKesihatanT3")||"null");if(s)Object.assign(state,s);}catch(e){}}
function progress(){let p=state.completed?100:state.screen==="home"?0:state.screen==="mission"?8:state.screen==="notes"?12+state.lesson*9:state.screen==="video"?58:state.screen==="game"?65:state.screen==="quiz"?70+state.qIndex/25*28:95;$("globalProgress").style.width=p+"%";}
function speak(text){if(!state.sound)return;try{if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="ms-MY";u.rate=.9;speechSynthesis.speak(u);}}catch(e){}}
function beep(ok){if(!state.sound)return;try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:220;g.gain.value=.07;o.start();o.stop(c.currentTime+.14);}catch(e){}}
function go(screen){state.screen=screen;save();render();}
function home(){state.screen="home";render();}
function start(){let n=$("studentName").value.trim();if(!n){$("nameError").textContent="Sila masukkan nama dahulu.";return;}state.name=n;state.screen="mission";save();render();}
function render(){
 progress();let s=$("screen");
 if(state.screen==="home"){s.innerHTML=`
 <section class="panel hero"><div><span class="eyebrow">🌟 MISI PEMBELAJARAN BAHARU</span><h1>Kembara <span style="color:var(--purple)">Keselamatan Diri</span></h1><p style="font-size:1.12rem">Jom jadi Penjelajah Bijak! Belajar mengenal ancaman sekeliling dan memilih tindakan yang selamat.</p><div class="meta-grid"><div class="meta"><b>MATA PELAJARAN</b><span>Pendidikan Kesihatan Tahun 3</span></div><div class="meta"><b>TEMA / UNIT</b><span>Unit 11: Jaga Diri Sihat Emosi</span></div><div class="meta"><b>NAMA GURU</b><span>${TEACHER}</span></div><div class="meta"><b>SEKOLAH</b><span>${SCHOOL}</span></div></div><label class="field" for="studentName">Nama murid</label><input id="studentName" class="name-input" placeholder="Taip nama kamu di sini" maxlength="70" value="${esc(state.name)}"><div id="nameError" class="muted" role="alert"></div><div class="actions"><button class="primary" id="startBtn">🚀 Mula Pembelajaran</button>${state.answers.length?'<button class="secondary" id="resumeBtn">↩ Sambung pembelajaran</button>':''}</div><p class="smallprint">Nota kurikulum: SK 7.1 — Kemahiran kecekapan psikososial untuk menjaga keselamatan diri. SP 7.1.1–7.1.4 diringkaskan pada halaman objektif. Sila semak padanan dengan DSKP/RPT sekolah sebelum digunakan sebagai rekod rasmi.</p></div><div class="hero-art" aria-label="Kartun pengembaraan"><span>🧒🏻</span><span class="float-tag a">🛡️ Bijak</span><span class="float-tag b">⭐ Berani</span></div></section>
 <section class="panel"><h2>🗺️ Apa yang menanti kamu?</h2><div class="tile-grid"><div class="tile blue"><div class="emoji">📚</div><h3>Nota berperingkat</h3><p>Belajar melalui contoh yang mudah.</p></div><div class="tile pink"><div class="emoji">🎬</div><h3>Video pembelajaran</h3><p>Tonton video berkaitan keselamatan diri.</p></div><div class="tile yellow"><div class="emoji">🎮</div><h3>Permainan pengukuhan</h3><p>Pilih tindakan paling selamat.</p></div><div class="tile green"><div class="emoji">🏆</div><h3>25 soalan cabaran</h3><p>Kumpul bintang dan buka lencana.</p></div></div></section>`;
 $("startBtn").onclick=start;let r=$("resumeBtn");if(r)r.onclick=()=>{if(!$("studentName").value.trim()&&state.name===""){state.name="Penjelajah";}else if($("studentName").value.trim())state.name=$("studentName").value.trim();go(state.completed?"result":state.screen==="home"?"mission":"mission");};}
 if(state.screen==="mission"){s.innerHTML=`<section class="panel"><span class="eyebrow">🧭 MISI 1 · TAKLIMAT</span><h2>Selamat datang, ${esc(state.name)}!</h2><p>Hari ini kamu akan menjadi <b>Penjelajah Keselamatan</b>. Baca nota, selesaikan permainan dan jawab 25 soalan.</p><h3>🎯 Objektif pembelajaran</h3><ul class="list-clean"><li>Menyatakan maksud ancaman sekeliling. <span class="pill">SP 7.1.1</span></li><li>Membincangkan persekitaran yang boleh mengancam keselamatan diri. <span class="pill">SP 7.1.2</span></li><li>Mengaplikasikan langkah mengelakkan situasi yang mengancam keselamatan diri. <span class="pill">SP 7.1.3</span></li><li>Menjana idea cara mengelakkan situasi yang boleh mengancam keselamatan diri. <span class="pill">SP 7.1.4</span></li></ul><div class="callout">🛡️ <b>Misi kamu:</b> belajar mengenal risiko, memilih tindakan selamat dan tahu siapa yang boleh membantu.</div><p class="muted">Standard dirujuk bagi Unit 11: Jaga Diri Sihat Emosi, bidang 7.0 Keselamatan, SK 7.1. Sila rujuk dokumen kurikulum rasmi sekolah untuk pengesahan akhir.</p><div class="actions"><button class="primary" id="toNotes">Mula Nota ➜</button><button class="secondary" id="homeBack">🏠 Kembali ke Menu Utama</button></div></section>`;$("toNotes").onclick=()=>{state.lesson=0;go("notes")};$("homeBack").onclick=home;}
 if(state.screen==="notes"){let l=lessons[state.lesson];s.innerHTML=`<section class="panel"><div class="step-label">📚 NOTA ${state.lesson+1} DARIPADA ${lessons.length}</div><div class="progress-wrap small"><div class="progress" style="width:${(state.lesson+1)/lessons.length*100}%"></div></div><div class="note-card ${l.color}"><div class="big">${l.icon}</div><h2>${l.title}</h2><p style="font-size:1.1rem">${l.body}</p></div><div class="tile-grid" style="margin-top:12px"><div class="tile yellow"><h3>💡 Contoh mudah</h3><p>${l.example}</p></div><div class="tile green"><h3>✅ Ingat ini</h3><p>${l.tip}</p></div></div><div class="actions"><button class="secondary" id="prevNote" ${state.lesson===0?"disabled":""}>← Sebelumnya</button><button class="primary" id="nextNote">${state.lesson===lessons.length-1?"Tonton Video ➜":"Seterusnya ➜"}</button><button class="secondary" id="homeBack">🏠 Menu Utama</button></div></section>`;$("prevNote").onclick=()=>{state.lesson=Math.max(0,state.lesson-1);save();render()};$("nextNote").onclick=()=>{if(state.lesson<lessons.length-1){state.lesson++;save();render()}else go("video")};$("homeBack").onclick=home;}
 if(state.screen==="video"){s.innerHTML=`<section class="panel"><span class="eyebrow">🎬 MISI 2 · TONTON DAN FIKIR</span><h2>Video pembelajaran</h2><p>Tonton video yang berkaitan dengan Unit 11: Jaga Diri Sihat Emosi. Pautan membuka YouTube dalam tab baharu.</p><div class="tile-grid"><div class="video-box"><div class="big">🎥</div><h3>Waspada Selalu</h3><p>Kenal pasti ancaman sekeliling dan persekitaran berisiko.</p><a href="${VIDEO1}" target="_blank" rel="noopener">▶ Buka video di YouTube</a></div><div class="video-box"><div class="big">🛡️</div><h3>Bijak Bertindak</h3><p>Fikirkan langkah untuk mengelakkan situasi yang mengancam keselamatan diri.</p><a href="${VIDEO2}" target="_blank" rel="noopener">▶ Buka video di YouTube</a></div></div><div class="callout">🗣️ Selepas menonton, cuba jawab: “Apakah tindakan pertama jika saya berasa tidak selamat?”</div><div class="actions"><button class="secondary" id="backNotes">← Ulang Kaji Nota</button><button class="primary" id="toGame">Main Permainan ➜</button><button class="secondary" id="homeBack">🏠 Menu Utama</button></div><p class="smallprint">Pautan video dikenal pasti daripada penerangan penerbit yang menyatakan rujukan Buku Teks PJK Tahun 3 KSSR Semakan 2017, DSKP dan DPK 2.0. Tontonan memerlukan internet.</p></section>`;$("backNotes").onclick=()=>go("notes");$("toGame").onclick=()=>go("game");$("homeBack").onclick=home;}
 if(state.screen==="game"){const scenarios=[{q:"Seorang yang tidak dikenali mengajak kamu ikutnya.",o:["Tolak dan beredar","Ikut sahaja"],a:0,e:"Jangan ikut. Pergi ke tempat selamat dan maklumkan orang dewasa."},{q:"Kamu berasa tidak selamat di kawasan sunyi.",o:["Pergi ke tempat terang dan ramai orang","Berjalan lebih jauh ke kawasan sunyi"],a:0,e:"Pilih tempat selamat dan cari bantuan."},{q:"Seseorang meminta kamu merahsiakan perkara yang menakutkan.",o:["Ceritakan kepada orang dewasa dipercayai","Simpan selama-lamanya"],a:0,e:"Kamu berhak mendapatkan bantuan."}];let i=state.gameIndex%scenarios.length,g=scenarios[i];s.innerHTML=`<section class="panel"><span class="eyebrow">🎮 MISI 3 · CABARAN PANTAS</span><h2>Apakah pilihan paling selamat?</h2><p>Jawab tiga situasi untuk memanaskan minda sebelum kuiz utama.</p><div class="quiz-head"><span>Cabaran ${Math.min(state.gameIndex+1,3)} / 3</span><span>⭐ ${state.gameScore} bintang</span></div><div class="progress-wrap small"><div class="progress" style="width:${Math.min(state.gameIndex,3)/3*100}%"></div></div><h3>${g.q}</h3><div class="choice-grid">${g.o.map((x,j)=>`<button class="choice" data-game="${j}">${String.fromCharCode(65+j)}. ${x}</button>`).join("")}</div><div id="gameFeedback"></div><div class="actions"><button class="secondary" id="gameReset">↻ Ulang permainan</button><button class="secondary" id="homeBack">🏠 Menu Utama</button></div></section>`;document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>{let a=+b.dataset.game;document.querySelectorAll("[data-game]").forEach(x=>x.disabled=true);let ok=a===g.a;if(ok)state.gameScore++;beep(ok);speak(ok?"Betul! Syabas!": "Belum tepat. Cuba lagi!");$("gameFeedback").innerHTML=`<div class="answer-feedback ${ok?"feedback-good":"feedback-bad"}"><b>${ok?"⭐ Betul! Syabas!":"Belum tepat."}</b><p>${g.e}</p><button class="primary" id="gameNext">${state.gameIndex>=2?"Terus ke 25 soalan":"Cabaran seterusnya ➜"}</button></div>`;save();$("gameNext").onclick=()=>{if(state.gameIndex>=2){state.gameDone=true;state.qIndex=0;state.answers=[];go("quiz")}else{state.gameIndex++;render()}}});$("gameReset").onclick=()=>{state.gameIndex=0;state.gameScore=0;state.gameDone=false;render()};$("homeBack").onclick=home;}
 if(state.screen==="quiz"){if(state.qIndex>=questions.length){state.completed=true;save();go("result");return;}let q=questions[state.qIndex],ans=state.answers[state.qIndex];s.innerHTML=`<section class="panel"><span class="eyebrow">🏆 MISI 4 · CABARAN PENJELAJAH</span><div class="quiz-head"><span>Soalan ${state.qIndex+1} / ${questions.length}</span><span>⭐ ${state.answers.filter((a,i)=>a===questions[i].a).length+state.gameScore} bintang</span></div><div class="progress-wrap small"><div class="progress" style="width:${state.qIndex/questions.length*100}%"></div></div><h2>${q.q}</h2><div class="choice-grid">${q.o.map((x,j)=>`<button class="choice ${ans!==undefined?(j===q.a?"correct":j===ans?"wrong":""):""}" data-answer="${j}" ${ans!==undefined?"disabled":""}>${String.fromCharCode(65+j)}. ${x}</button>`).join("")}</div><div id="quizFeedback">${ans!==undefined?`<div class="answer-feedback ${ans===q.a?"feedback-good":"feedback-bad"}"><b>${ans===q.a?"⭐ Betul! Syabas!":"Belum tepat."}</b><p>${q.e}</p><button class="primary" id="quizNext">${state.qIndex===questions.length-1?"Lihat Keputusan":"Soalan seterusnya ➜"}</button></div>`:""}</div><div class="actions"><button class="secondary" id="homeBack">🏠 Menu Utama</button><button class="secondary" id="reviewNotes">📚 Ulang Kaji Nota</button></div><p class="smallprint">Pilih satu jawapan. Maklum balas diberikan serta-merta. Jawapan yang telah dihantar dikunci untuk mengelakkan perubahan markah tidak sengaja.</p></section>`;if(ans===undefined)document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{let a=+b.dataset.answer;state.answers[state.qIndex]=a;let ok=a===q.a;beep(ok);speak(ok?"Betul! Syabas!":"Belum tepat. Cuba lagi!");save();render()});let nx=$("quizNext");if(nx)nx.onclick=()=>{state.qIndex++;save();render()};$("homeBack").onclick=home;$("reviewNotes").onclick=()=>go("notes");}
 if(state.screen==="result"){let correct=state.answers.filter((a,i)=>a===questions[i].a).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100),stars=correct>=22?5:correct>=18?4:correct>=14?3:correct>=10?2:1,medal=correct>=22?"🏅 Pakar Keselamatan":correct>=17?"🥇 Penjelajah Bijak":correct>=12?"🥈 Pemerhati Cekap":"🌱 Murid Berusaha";s.innerHTML=`<section class="panel" id="report"><div style="text-align:center"><div style="font-size:4rem">🎉</div><span class="eyebrow">MISI SELESAI</span><h1>Tahniah, ${esc(state.name)}!</h1><p>Kamu telah menyelesaikan Kembara Keselamatan Diri.</p><div class="result-score">${correct}<span style="font-size:1.5rem;color:var(--ink)"> / 25</span></div><p class="muted">Markah kuiz</p><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(5-stars)}</div><div class="badge-card">${medal}</div></div><div class="meta-grid" style="margin-top:20px"><div class="meta"><b>JAWAPAN BETUL</b><span>${correct}</span></div><div class="meta"><b>JAWAPAN SALAH</b><span>${wrong}</span></div><div class="meta"><b>PERATUS PENCAPAIAN</b><span>${pct}%</span></div><div class="meta"><b>BINTANG PERMAINAN</b><span>⭐ ${state.gameScore}</span></div></div><div class="callout"><b>💬 Pesanan:</b> ${pct>=88?"Hebat! Kamu menunjukkan pemahaman yang sangat baik. Terus amalkan langkah keselamatan.":pct>=60?"Bagus! Semak penerangan bagi soalan yang tersilap dan cuba lagi.":"Terus berusaha! Baca nota sekali lagi bersama guru atau penjaga, kemudian cuba kuiz semula."}</div><h2>Semak jawapan dan penerangan</h2>${questions.map((q,i)=>{let a=state.answers[i],ok=a===q.a;return `<div class="review-row"><details><summary>${i+1}. ${q.q} <span class="pill">${ok?"Betul":"Semak semula"}</span></summary><p><b>Jawapan betul:</b> ${q.o[q.a]}</p><p><b>Jawapan kamu:</b> ${a===undefined?"Belum dijawab":q.o[a]}</p><p>${q.e}</p></details></div>`}).join("")}<div class="actions no-print"><button class="primary" id="retry">🔁 Cuba Semula Kuiz</button><button class="secondary" id="notesAgain">📚 Ulang Kaji Nota</button><button class="secondary" id="printReport">🖨️ Cetak / Simpan PDF</button><button class="secondary" id="homeBack">🏠 Kembali ke Menu Utama</button></div><p class="smallprint">Laporan dijana dalam pelayar ini. Pilih “Cetak / Simpan PDF” dan kemudian “Save as PDF” jika pilihan itu tersedia. Simpanan kemajuan menggunakan storan setempat pelayar pada peranti ini.</p></section>`;$("retry").onclick=()=>{state.qIndex=0;state.answers=[];state.completed=false;go("quiz")};$("notesAgain").onclick=()=>{state.lesson=0;go("notes")};$("printReport").onclick=()=>window.print();$("homeBack").onclick=home;}
}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("soundBtn").onclick=()=>{state.sound=!state.sound;$("soundBtn").textContent=state.sound?"🔊 Bunyi: Hidup":"🔇 Bunyi: Mati";$("soundBtn").setAttribute("aria-pressed",String(state.sound));if(!state.sound&&"speechSynthesis"in window)speechSynthesis.cancel();};
$("homeBtn").onclick=home;
load();$("soundBtn").textContent=state.sound?"🔊 Bunyi: Hidup":"🔇 Bunyi: Mati";render();
</script>
